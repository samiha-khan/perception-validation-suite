# Central configuration for the perception validation & monitoring toolkit.
# All stages (models, ood, calibration, robustness, ci, reports) read this file
# so thresholds and paths live in exactly one place.

seed: 42

data:
  root: data
  image_size: 224          # ResNet18 pretrained input resolution
  num_classes: 43
  train_val_calib_split: [0.8, 0.1, 0.1]   # split of official GTSRB train set

model:
  arch: resnet18
  pretrained: true
  freeze: [conv1, bn1, layer1, layer2]     # frozen backbone stages
  checkpoint: models/checkpoints/gtsrb_resnet18.ckpt
  epochs: 6
  batch_size: 64
  lr_head: 1.0e-3
  lr_backbone: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 4

ood:
  results_dir: ood/results
  metrics_file: ood/results/ood_metrics.json
  roc_file: ood/results/roc_curves.json

calibration:
  results_dir: calibration/results
  metrics_file: calibration/results/calibration_metrics.json
  reliability_plot: calibration/results/reliability_diagram.png
  temperature_file: calibration/results/temperature.json
  conformal_alpha: 0.1        # target miscoverage -> 90% target coverage
  ece_bins: 15

robustness:
  results_dir: robustness/results
  table_file: robustness/results/corruption_table.json
  corruptions: [gaussian_noise, motion_blur, brightness, fog]
  severities: [1, 3, 5]

thresholds:
  ood_auroc_min: 0.85          # min AUROC (avg of detectors) to pass CI gate
  ece_max: 0.05                # max post-calibration ECE to pass CI gate
  conformal_coverage_tolerance: 0.05   # |empirical - target| coverage tolerance

reports:
  output_file: reports/output/report.html
