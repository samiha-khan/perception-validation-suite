name: Perception Eval Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The fine-tuned checkpoint is committed to the repo (models/checkpoints),
      # so only the datasets need caching here.
      - name: Cache datasets
        id: cache-datasets
        uses: actions/cache@v4
        with:
          path: data
          key: gtsrb-${{ hashFiles('models/**/*.py', 'config.yaml') }}

      # GTSRB/CIFAR-10 normally download from sid.erda.dk / cs.toronto.edu,
      # which are heavily throttled for GitHub-hosted runner IPs (~60x slower
      # than a normal connection). Restore the same files, byte-for-byte
      # (md5-verified), from a release mirror in this repo instead. Placing
      # them where torchvision expects makes its own download() calls skip
      # the network fetch and just extract locally.
      - name: Restore dataset mirror from release
        if: steps.cache-datasets.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/gtsrb /tmp/dataset-mirror
          gh release download dataset-mirror-v1 \
            --repo ${{ github.repository }} \
            --dir /tmp/dataset-mirror --clobber
          mv /tmp/dataset-mirror/GTSRB-Training_fixed.zip data/gtsrb/
          mv /tmp/dataset-mirror/GTSRB_Final_Test_Images.zip data/gtsrb/
          mv /tmp/dataset-mirror/GTSRB_Final_Test_GT.zip data/gtsrb/
          mv /tmp/dataset-mirror/cifar-10-python.tar.gz data/

      - name: Run eval suite (OOD, calibration, robustness, gate)
        run: python -m ci.run_eval_suite

      - name: Generate HTML report
        if: always()
        run: python -m reports.generate_report

      - name: Upload report + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            reports/output/report.html
            ood/results/*.json
            calibration/results/*.json
            calibration/results/*.png
            robustness/results/*.json
          retention-days: 30
